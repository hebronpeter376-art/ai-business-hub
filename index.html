<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Business Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --soft:#f8fafc;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;

  --primary:#2563eb;
  --hover:#1d4ed8;

  --success:#16a34a;
  --warning:#d97706;

  --sidebar:#111827;
  --sidebarHover:#1f2937;

  --sidebar-width:245px;
  --sidebar-collapsed:0px;

  --transition:.28s ease;
}

/* DARK THEME */
html.dark-theme{
  color-scheme:dark;
}

.dark-theme{
  --bg:#0b1120;
  --panel:#111827;
  --soft:#172033;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --border:#263244;
  --primary:#3b82f6;
  --hover:#2563eb;
  --sidebar:#070b14;
  --sidebarHover:#182235;
}

.dark-theme .topbar{
  box-shadow:0 1px 0 rgba(255,255,255,.03);
}

.dark-theme .conversation.active{
  background:#172554;
}

.dark-theme .conversation-avatar{
  background:#1e3a8a;
  color:#bfdbfe;
}

.dark-theme th{
  background:#172033;
}

.dark-theme .ai-suggestion{
  background:#111827;
}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:"Space Grotesk",sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,
input{
  font:inherit;
}


/* =====================================================
   APP
===================================================== */

.app{
  display:flex;
  min-height:100vh;
  width:100%;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  width:var(--sidebar-width);
  min-width:var(--sidebar-width);

  background:var(--sidebar);
  color:#fff;

  padding:22px 14px;

  display:flex;
  flex-direction:column;

  min-height:100vh;

  overflow:hidden;

  transition:
    width var(--transition),
    min-width var(--transition),
    padding var(--transition),
    transform var(--transition);
}


/* COLLAPSED SIDEBAR */

.app.sidebar-collapsed .sidebar{
  width:0;
  min-width:0;
  padding-left:0;
  padding-right:0;
}


/* =====================================================
   LOGO
===================================================== */

.logo{
  padding:4px 12px 25px;
  white-space:nowrap;

  transition:
    opacity .18s ease,
    transform .18s ease;
}

.logo-name{
  font-size:20px;
  font-weight:700;
}

.logo-sub{
  font-size:11px;
  color:#9ca3af;
  margin-top:4px;
}


/* Hide sidebar contents when collapsed */

.app.sidebar-collapsed .logo,
.app.sidebar-collapsed .nav,
.app.sidebar-collapsed .sidebar-bottom{
  opacity:0;
  transform:translateX(-15px);
  pointer-events:none;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
  display:flex;
  flex-direction:column;
  gap:7px;

  transition:
    opacity .18s ease,
    transform .18s ease;
}

.nav button{
  width:100%;

  border:0;
  background:transparent;

  color:#d1d5db;

  padding:11px 13px;

  border-radius:10px;

  text-align:left;

  cursor:pointer;

  font-size:14px;
  font-weight:500;

  transition:
    background .25s ease,
    color .25s ease,
    transform .25s ease,
    box-shadow .25s ease;
}

.nav button:hover{
  background:var(--sidebarHover);
  color:#fff;
  transform:scale(1.025);
}

.nav button.active{
  background:var(--sidebarHover);
  color:#fff;

  transform:scale(1.075);

  box-shadow:0 6px 20px #0003;

  font-weight:600;
}

.nav button.active::before{
  content:"";

  display:inline-block;

  width:3px;
  height:18px;

  background:#60a5fa;

  border-radius:10px;

  margin-right:8px;

  vertical-align:-4px;
}


/* =====================================================
   SIDEBAR BOTTOM
===================================================== */

.sidebar-bottom{
  margin-top:auto;

  border-top:1px solid #374151;

  padding-top:15px;

  transition:
    opacity .18s ease,
    transform .18s ease;
}

.status{
  display:flex;
  gap:7px;
  align-items:center;

  color:#9ca3af;

  font-size:12px;

  padding:8px 12px;

  white-space:nowrap;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:0 0 8px #22c55e99;

  flex-shrink:0;
}


/* =====================================================
   MAIN
===================================================== */

.main{
  flex:1;

  min-width:0;

  display:flex;
  flex-direction:column;

  transition:width var(--transition);
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{
  height:70px;

  background:var(--panel);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 30px;

  flex-shrink:0;
}


/* =====================================================
   TOPBAR LEFT
===================================================== */

.topbar-left{
  display:flex;
  align-items:center;
  gap:15px;

  min-width:0;
}


/* =====================================================
   HAMBURGER BUTTON
===================================================== */

.menu-toggle{
  width:42px;
  height:42px;

  border:1px solid var(--border);

  background:var(--panel);

  color:var(--text);

  border-radius:10px;

  display:grid;
  place-items:center;

  cursor:pointer;

  font-size:21px;

  line-height:1;

  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

.menu-toggle:hover{
  background:var(--soft);

  border-color:#d1d5db;

  transform:scale(1.04);
}

.menu-toggle:active{
  transform:scale(.96);
}

.theme-toggle{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:10px;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:18px;
  transition:background .2s ease,color .2s ease,transform .2s ease,border-color .2s ease;
}

.theme-toggle:hover{
  background:var(--soft);
  transform:scale(1.04);
}

.theme-toggle:active{
  transform:scale(.96);
}

.topbar-actions{
  display:flex;
  align-items:center;
  gap:10px;
}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-title{
  font-size:18px;
  font-weight:600;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;
}


/* =====================================================
   USER AREA
===================================================== */

.user-area{
  display:flex;

  align-items:center;

  gap:12px;

  font-size:13px;
}

.avatar{
  width:36px;
  height:36px;

  border-radius:50%;

  background:var(--primary);

  color:#fff;

  display:grid;

  place-items:center;

  font-weight:600;

  flex-shrink:0;
}


/* =====================================================
   PAGE WRAPPER
===================================================== */

.page-wrapper{
  flex:1;

  overflow:auto;
}


/* =====================================================
   CONTENT
===================================================== */

.content{
  padding:30px;

  max-width:1400px;

  width:100%;

  margin:auto;
}


/* =====================================================
   PAGE ANIMATIONS
===================================================== */

.page-transition{
  animation:enter .28s ease;
}

.page-exit{
  animation:exit .15s ease;
}

@keyframes enter{

  from{
    opacity:0;
    transform:translateX(20px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

@keyframes exit{

  from{
    opacity:1;
  }

  to{
    opacity:0;
    transform:translateX(-15px);
  }

}


/* =====================================================
   GENERAL
===================================================== */

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  margin:0;
  font-size:27px;
}

.welcome p{
  margin:6px 0 0;

  color:var(--muted);

  font-size:14px;
}


/* =====================================================
   CARDS
===================================================== */

.cards{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:16px;

  margin-bottom:25px;
}

.card,
.panel{
  background:var(--panel);

  border:1px solid var(--border);

  border-radius:14px;
}

.card{
  padding:20px;

  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);

  box-shadow:0 8px 25px #0000000f;
}

.card-label{
  color:var(--muted);

  font-size:12px;
}

.card-value{
  font-size:28px;

  font-weight:700;

  margin-top:8px;
}

.card-change{
  font-size:11px;

  margin-top:6px;
}

.green{
  color:var(--success);
}

.orange{
  color:var(--warning);
}


/* =====================================================
   DASHBOARD GRID
===================================================== */

.dashboard-grid{
  display:grid;

  grid-template-columns:1.5fr 1fr;

  gap:20px;
}

.panel{
  overflow:hidden;
}

.panel-header{
  padding:17px 20px;

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.panel-title{
  font-weight:600;

  font-size:14px;
}

.panel-action,
.link-btn{
  border:0;

  background:transparent;

  color:var(--primary);

  cursor:pointer;

  font-size:12px;
}

.panel-body{
  padding:20px;
}


/* =====================================================
   LISTS
===================================================== */

.list{
  padding:4px 0;
}

.list-item{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding:15px 20px;

  border-bottom:1px solid var(--border);
}

.list-item:last-child{
  border:0;
}

.list-item:hover{
  background:var(--soft);
}

.item-left{
  display:flex;

  align-items:center;

  gap:11px;

  min-width:0;
}

.item-icon{
  width:35px;
  height:35px;

  border-radius:9px;

  background:var(--soft);

  display:grid;

  place-items:center;

  flex-shrink:0;
}

.item-title{
  font-size:13px;

  font-weight:600;
}

.item-sub{
  font-size:11px;

  color:var(--muted);

  margin-top:3px;
}


/* =====================================================
   BADGES
===================================================== */

.badge{
  font-size:10px;

  padding:5px 8px;

  border-radius:20px;

  white-space:nowrap;
}

.badge-blue{
  background:#dbeafe;

  color:#1d4ed8;
}

.badge-orange{
  background:#fef3c7;

  color:#b45309;
}

.badge-green{
  background:#dcfce7;

  color:#15803d;
}

.badge-red{
  background:#fee2e2;

  color:#b91c1c;
}


/* =====================================================
   BUTTONS
===================================================== */

.primary-btn,
.secondary-btn{
  border-radius:9px;

  padding:10px 14px;

  cursor:pointer;

  font-size:13px;
}

.primary-btn{
  border:0;

  background:var(--primary);

  color:#fff;
}

.primary-btn:hover{
  background:var(--hover);
}

.secondary-btn{
  border:1px solid var(--border);

  background:var(--panel);

  color:var(--text);
}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;
}

th,
td{
  text-align:left;

  padding:14px 18px;

  border-bottom:1px solid var(--border);

  font-size:12px;
}

th{
  color:var(--muted);

  background:var(--soft);
}


/* =====================================================
   INFO BOX
===================================================== */

.info-box{
  background:var(--soft);

  border:1px solid var(--border);

  border-radius:12px;

  padding:18px;

  line-height:1.6;
}

.info-box p{
  color:var(--muted);

  font-size:13px;
}


/* =====================================================
   INTEGRATIONS
===================================================== */

.integration-grid{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:15px;
}

.integration{
  border:1px solid var(--border);

  border-radius:12px;

  padding:18px;

  background:var(--panel);
}

.integration-icon{
  font-size:25px;

  margin-bottom:12px;
}

.integration-name{
  font-weight:600;

  font-size:14px;
}

.integration-description{
  color:var(--muted);

  font-size:12px;

  margin:6px 0 15px;

  line-height:1.5;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages-layout{
  display:grid;

  grid-template-columns:340px 1fr;

  gap:20px;

  height:calc(100vh - 180px);

  min-height:520px;
}

.conversations-panel,
.chat-panel{
  min-height:0;

  display:flex;

  flex-direction:column;
}

.message-search{
  padding:12px;

  border-bottom:1px solid var(--border);
}

.message-search input{
  width:100%;

  border:1px solid var(--border);

  background:var(--soft);

  color:var(--text);

  border-radius:9px;

  padding:10px 12px;

  outline:0;
}

.conversation-list{
  overflow:auto;

  flex:1;
}

.conversation{
  display:flex;

  align-items:center;

  gap:11px;

  padding:14px;

  border-bottom:1px solid var(--border);

  cursor:pointer;

  transition:.2s;
}

.conversation:hover{
  background:var(--soft);
}

.conversation.active{
  background:#eff6ff;

  transform:translateX(3px);
}

.conversation-avatar{
  width:38px;
  height:38px;

  min-width:38px;

  border-radius:50%;

  background:#dbeafe;

  color:#1d4ed8;

  display:grid;

  place-items:center;

  font-size:13px;

  font-weight:700;
}

.conversation-info{
  min-width:0;

  flex:1;
}

.conversation-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.conversation-top strong{
  font-size:13px;
}

.conversation-top span{
  color:var(--muted);

  font-size:10px;
}

.conversation-preview{
  color:var(--muted);

  font-size:11px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  margin-top:4px;
}

.unread{
  width:20px;
  height:20px;

  border-radius:50%;

  background:var(--primary);

  color:#fff;

  display:grid;

  place-items:center;

  font-size:9px;
}

.chat-customer{
  display:flex;

  align-items:center;

  gap:10px;
}

.chat-online{
  color:var(--muted);

  font-size:10px;

  margin-top:3px;
}

.chat-messages{
  flex:1;

  overflow:auto;

  padding:22px;

  background:var(--soft);
}

.chat-message{
  max-width:72%;

  width:max-content;

  padding:11px 14px;

  border-radius:14px;

  margin-bottom:12px;

  font-size:12px;

  line-height:1.5;

  white-space:pre-line;
}

.chat-message.user{
  margin-left:auto;

  background:var(--primary);

  color:#fff;

  border-bottom-right-radius:4px;
}

.chat-message.ai{
  background:var(--panel);

  border:1px solid var(--border);

  border-bottom-left-radius:4px;
}

.ai-suggestion{
  padding:13px 15px;

  border-top:1px solid var(--border);

  background:#f8fafc;
}

.ai-suggestion-title{
  font-size:11px;

  font-weight:700;

  margin-bottom:5px;
}

.ai-suggestion-text{
  color:var(--muted);

  font-size:11px;

  line-height:1.5;

  margin-bottom:8px;
}

.chat-input{
  display:flex;

  gap:8px;

  padding:14px;

  border-top:1px solid var(--border);
}

.chat-input input{
  flex:1;

  min-width:0;

  border:1px solid var(--border);

  background:var(--soft);

  color:var(--text);

  border-radius:9px;

  padding:11px;

  outline:0;
}


/* =====================================================
   MOBILE SIDEBAR OVERLAY
===================================================== */

.sidebar-overlay{
  display:none;

  position:fixed;

  inset:0;

  background:#0008;

  z-index:90;

  opacity:0;

  pointer-events:none;

  transition:opacity .25s ease;
}


.primary-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.ai-thinking{
  animation:aiPulse 1.2s ease-in-out infinite;
}

@keyframes aiPulse{
  0%,100%{opacity:.55;}
  50%{opacity:1;}
}
  /* OWNER AI ASSISTANT */

.ai-assistant-panel{
  display:flex;
  flex-direction:column;
  height:calc(100vh - 280px);
  min-height:520px;
  overflow:hidden;
}

.owner-chat-messages{
  flex:1;
  overflow-y:auto;
  padding:24px;
  background:var(--soft);
}

.owner-message{
  max-width:75%;
  width:max-content;
  padding:13px 16px;
  border-radius:14px;
  margin-bottom:14px;
  font-size:13px;
  line-height:1.6;
}

.owner-message.ai{
  background:var(--panel);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}

.owner-message.user{
  margin-left:auto;
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:4px;
}

.owner-message-label{
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:5px;
}

.owner-message.user .owner-message-label{
  color:#dbeafe;
}

.owner-chat-input{
  display:flex;
  gap:9px;
  padding:15px;
  background:var(--panel);
  border-top:1px solid var(--border);
}

.owner-chat-input input{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:10px;
  padding:12px 13px;
  outline:none;
  transition:border-color .2s ease,
             box-shadow .2s ease;
}

.owner-chat-input input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #2563eb22;
}

.owner-chat-input button{
  min-width:75px;
}

@media(max-width:700px){

  .ai-assistant-panel{
    height:calc(100vh - 240px);
    min-height:450px;
  }

  .owner-message{
    max-width:88%;
  }

}
  /* 2026 AI AVATAR */

.ai-message-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.ai-avatar{
  width:42px;
  height:42px;
  position:relative;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ai-avatar-glow{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);
  filter:blur(9px);
  opacity:.5;
  animation:aiGlow 3s ease-in-out infinite;
}

.ai-avatar-core{
  width:38px;
  height:38px;
  position:relative;
  border-radius:50%;
  background:linear-gradient(145deg,#111827,#312e81,#06b6d4);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 4px 18px rgba(79,70,229,.4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.ai-avatar-face{
  width:24px;
  height:19px;
  position:relative;
}

.ai-eye{
  position:absolute;
  top:5px;
  width:4px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px #67e8f9;
}

.ai-eye.left{
  left:4px;
}

.ai-eye.right{
  right:4px;
}

.ai-mouth{
  position:absolute;
  width:8px;
  height:3px;
  left:8px;
  bottom:1px;
  border-bottom:2px solid #fff;
  border-radius:0 0 10px 10px;
}

.ai-avatar-ring{
  position:absolute;
  inset:-3px;
  border-radius:50%;
  border:1px solid rgba(99,102,241,.5);
  animation:aiRing 3s linear infinite;
}

.ai-spark{
  position:absolute;
  color:#fff;
  font-size:9px;
  text-shadow:0 0 8px #67e8f9;
  animation:aiSpark 2.5s ease-in-out infinite;
}

.spark-1{
  top:-6px;
  right:0;
}

.spark-2{
  bottom:-5px;
  left:0;
}

@keyframes aiGlow{
  0%,100%{
    transform:scale(.9);
    opacity:.35;
  }
  50%{
    transform:scale(1.15);
    opacity:.65;
  }
}

@keyframes aiRing{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

@keyframes aiSpark{
  0%,100%{
    transform:scale(.7);
    opacity:.4;
  }
  50%{
    transform:scale(1.2);
    opacity:1;
  }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1050px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .integration-grid{
    grid-template-columns:1fr 1fr;
  }

}

/* =====================================================
   ELEMENTS
===================================================== */

const app =
  document.getElementById("app");

const menuToggle =
  document.getElementById("menuToggle");

const themeToggle =
  document.getElementById("themeToggle");

const sidebarOverlay =
  document.getElementById("sidebarOverlay");

const pageContent =
  document.getElementById("pageContent");

const pageTitle =
  document.getElementById("pageTitle");

const navButtons =
  document.querySelectorAll(".nav button");


/* =====================================================
   THEME SYSTEM
===================================================== */

let currentTheme =
  localStorage.getItem("theme") || "light";

function applyTheme(){

  const isDark = currentTheme === "dark";

  document.documentElement.classList.toggle(
    "dark-theme",
    isDark
  );

  themeToggle.innerHTML =
    isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';

  if (window.lucide) {
    lucide.createIcons();
  }

  themeToggle.setAttribute(
    "aria-label",
    isDark ? "Switch to light theme" : "Switch to dark theme"
  );

  themeToggle.title =
    isDark ? "Switch to light theme" : "Switch to dark theme";
}

function toggleTheme(){

  currentTheme =
    currentTheme === "dark" ? "light" : "dark";

  localStorage.setItem(
    "theme",
    currentTheme
  );

  applyTheme();
}

themeToggle.addEventListener(
  "click",
  toggleTheme
);


/* =====================================================
   SIDEBAR STATE
===================================================== */

let sidebarCollapsed =
  localStorage.getItem("sidebarCollapsed") === "true";


/* =====================================================
   CHECK MOBILE
===================================================== */

function isMobile(){

  return window.innerWidth <= 700;

}


/* =====================================================
   UPDATE MENU ICON
===================================================== */

function updateMenuButton(){

  if(isMobile()){

    const isOpen =
      app.classList.contains(
        "mobile-sidebar-open"
      );

    menuToggle.textContent =
      isOpen ? "✕" : "☰";

    menuToggle.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );

  }

  else{

    const isCollapsed =
      app.classList.contains(
        "sidebar-collapsed"
      );

    menuToggle.textContent =
      isCollapsed ? "☰" : "✕";

    menuToggle.setAttribute(
      "aria-expanded",
      isCollapsed ? "false" : "true"
    );

  }

}


/* =====================================================
   APPLY SIDEBAR STATE
===================================================== */

function applySidebarState(){

  if(isMobile()){

    app.classList.remove(
      "sidebar-collapsed"
    );

    app.classList.remove(
      "mobile-sidebar-open"
    );

  }

  else{

    app.classList.remove(
      "mobile-sidebar-open"
    );

    app.classList.toggle(
      "sidebar-collapsed",
      sidebarCollapsed
    );

  }

  updateMenuButton();

}


/* =====================================================
   TOGGLE SIDEBAR
===================================================== */

function toggleSidebar(){

  if(isMobile()){

    app.classList.toggle(
      "mobile-sidebar-open"
    );

  }

  else{

    sidebarCollapsed =
      !sidebarCollapsed;

    app.classList.toggle(
      "sidebar-collapsed",
      sidebarCollapsed
    );

    localStorage.setItem(
      "sidebarCollapsed",
      sidebarCollapsed
    );

  }

  updateMenuButton();

}


/* =====================================================
   MENU BUTTON
===================================================== */

menuToggle.addEventListener(
  "click",
  toggleSidebar
);


/* =====================================================
   MOBILE OVERLAY
===================================================== */

sidebarOverlay.addEventListener(
  "click",
  ()=>{

    if(isMobile()){

      app.classList.remove(
        "mobile-sidebar-open"
      );

      updateMenuButton();

    }

  }
);


/* =====================================================
   CLOSE MOBILE SIDEBAR AFTER PAGE CLICK
===================================================== */

function closeMobileSidebar(){

  if(isMobile()){

    app.classList.remove(
      "mobile-sidebar-open"
    );

    updateMenuButton();

  }

}


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    applySidebarState();

  }
);


/* =====================================================
   DEMO ALERT
===================================================== */

function demoAlert(text){

  alert(text);

}


/* =====================================================
   CHANGE PAGE
===================================================== */

function changePage(pageName){

  if(!pages[pageName]){
    return;
  }


  pageContent.classList.remove(
    "page-transition"
  );

  pageContent.classList.add(
    "page-exit"
  );


  setTimeout(()=>{

    pageContent.innerHTML =
      pages[pageName];


    pageTitle.textContent =
      pageName;


    pageContent.classList.remove(
      "page-exit"
    );


    void pageContent.offsetWidth;


    pageContent.classList.add(
      "page-transition"
    );


    activateInternalLinks();


    if(pageName === "Messages"){

      activateMessageSystem();

    }


  },150);

}


/* =====================================================
   SIDEBAR NAVIGATION
===================================================== */

navButtons.forEach(
  button=>{

    button.addEventListener(
      "click",
      ()=>{

        navButtons.forEach(
          btn=>{

            btn.classList.remove(
              "active"
            );

          }
        );


        button.classList.add(
          "active"
        );


        changePage(
          button.dataset.page
        );


        closeMobileSidebar();

      }
    );

  }
);


/* =====================================================
   INTERNAL DASHBOARD LINKS
===================================================== */

function activateInternalLinks(){

  document
    .querySelectorAll("[data-goto]")
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          ()=>{

            const pageName =
              button.dataset.goto;


            navButtons.forEach(
              btn=>{

                btn.classList.toggle(
                  "active",
                  btn.dataset.page === pageName
                );

              }
            );


            changePage(
              pageName
            );

          }
        );

      }
    );

}


/* =====================================================
   AI API
===================================================== */

const AI_WORKER_URL =
  "https://ai-business-hub-api.hebronpeter376.workers.dev";

async function askBusinessAI(message){

  const response = await fetch(
    AI_WORKER_URL,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
    message:String(message),
    mode:"owner",
    history:conversationHistory.slice(-20)
})
    }
  );

  let data;

  try{
    data = await response.json();
  }catch(error){
    throw new Error("The AI service returned an invalid response.");
  }

  if(!response.ok){
    throw new Error(
      data?.error || "The AI service could not process the request."
    );
  }

  return data.reply || "I couldn't generate a response.";
}


/* =====================================================
   MESSAGE SYSTEM
===================================================== */

function activateMessageSystem(){


  const conversations =
    document.querySelectorAll(
      ".conversation"
    );


  const search =
    document.getElementById(
      "conversationSearch"
    );


  const customer =
    document.getElementById(
      "chatCustomer"
    );


  const avatar =
    document.getElementById(
      "chatAvatar"
    );


  const chatMessages =
    document.getElementById(
      "chatMessages"
    );


  const input =
    document.getElementById(
      "businessMessageInput"
    );


  const form =
    document.getElementById(
      "businessChatForm"
    );


  const suggestion =
    document.getElementById(
      "aiSuggestion"
    );


  const useSuggestion =
    document.getElementById(
      "useSuggestion"
    );


  /* ===================================================
     SELECT CONVERSATION
  =================================================== */

  conversations.forEach(
    conversation=>{

      conversation.addEventListener(
        "click",
        ()=>{


          conversations.forEach(
            c=>{

              c.classList.remove(
                "active"
              );

            }
          );


          conversation.classList.add(
            "active"
          );


          const name =
            conversation.dataset.name;


          const latest =
            conversation.dataset.message;


          customer.textContent =
            name;


          avatar.textContent =
            name.charAt(0);


          chatMessages.innerHTML =
            "";


          addChatMessage(
            latest,
            "user"
          );


          addChatMessage(
            `Thanks for contacting us, ${name}! 👋 How can we help you today?`,
            "ai"
          );


          suggestion.textContent =
            `"Hi ${name}! Thanks for reaching out. I'd be happy to help you with that."`;

        }
      );

    }
  );


  /* ===================================================
     SEARCH
  =================================================== */

  if(search){

    search.addEventListener(
      "input",
      ()=>{

        const value =
          search.value
            .toLowerCase()
            .trim();


        conversations.forEach(
          conversation=>{

            const name =
              conversation.dataset.name
                .toLowerCase();


            const message =
              conversation.dataset.message
                .toLowerCase();


            const matches =
              name.includes(value) ||
              message.includes(value);


            conversation.style.display =
              matches
              ? "flex"
              : "none";

          }
        );

      }
    );

  }


  /* ===================================================
     ADD CHAT MESSAGE
  =================================================== */

  function addChatMessage(
    text,
    type
  ){

    const message =
      document.createElement(
        "div"
      );


    message.className =
      "chat-message " + type;


    message.textContent =
      text;


    chatMessages.appendChild(
      message
    );


    chatMessages.scrollTop =
      chatMessages.scrollHeight;

  }


  /* ===================================================
     USE AI SUGGESTION
  =================================================== */

  if(useSuggestion){

    useSuggestion.addEventListener(
      "click",
      ()=>{

        input.value =
          suggestion.textContent
            .replace(/^"|"$/g,"")
            .trim();


        input.focus();

      }
    );

  }


  /* ===================================================
     SEND MESSAGE TO REAL AI
  =================================================== */

  if(form){

    form.addEventListener(
      "submit",
      async event=>{

        event.preventDefault();

        const text =
          input.value.trim();

        if(!text){
          return;
        }

        addChatMessage(
          text,
          "user"
        );

        input.value = "";

        const sendButton =
          form.querySelector("button[type='submit']");

        const originalButtonText =
          sendButton ? sendButton.textContent : "Send";

        if(sendButton){
          sendButton.disabled = true;
          sendButton.textContent = "Thinking...";
        }

        input.disabled = true;

        const thinkingMessage =
          document.createElement("div");

        thinkingMessage.className =
          "chat-message ai ai-thinking";

        thinkingMessage.textContent =
          "🤖 AI is thinking...";

        chatMessages.appendChild(
          thinkingMessage
        );

        chatMessages.scrollTop =
          chatMessages.scrollHeight;

        try{

          const reply =
            await askBusinessAI(text);

          thinkingMessage.remove();

          addChatMessage(
            reply,
            "ai"
          );

          suggestion.textContent =
            `"${reply}"`;

        }catch(error){

          thinkingMessage.remove();

          addChatMessage(
            `Sorry, I couldn't reach the AI right now. ${error.message}`,
            "ai"
          );

        }finally{

          input.disabled = false;
          input.focus();

          if(sendButton){
            sendButton.disabled = false;
            sendButton.textContent = originalButtonText;
          }

        }

      }
    );

  }

}


/* =====================================================
   INITIALIZE DASHBOARD
===================================================== */

pageContent.innerHTML =
  pages.Dashboard;

applyTheme();

if (window.lucide) {
  lucide.createIcons();
}


activateInternalLinks();


applySidebarState();

</script>
