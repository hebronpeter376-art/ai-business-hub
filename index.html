<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Business Hub</title>

<meta name="description"
      content="AI-powered business management dashboard">

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --text:#111827;
  --muted:#64748b;
  --border:#e5e7eb;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#d97706;
  --shadow:0 12px 35px rgba(15,23,42,.07);
  --sidebar:260px;
  --topbar:72px;
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:
    background .3s ease,
    color .3s ease;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

body.dark{
  --bg:#0b1120;
  --surface:#111827;
  --surface2:#172033;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#243047;
  --shadow:0 15px 40px rgba(0,0,0,.25);
}

/* =========================
   APP
========================= */

.app{
  min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  z-index:100;
  left:0;
  top:0;
  bottom:0;
  width:var(--sidebar);
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:
    transform .35s ease,
    width .35s ease;
}

.brand{
  height:var(--topbar);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.brand-title{
  font-weight:800;
  letter-spacing:-.3px;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.nav{
  padding:14px 10px;
  overflow:auto;
  flex:1;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  border-radius:13px;
  margin-bottom:4px;
  text-align:left;
  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease;
}

.nav button:hover{
  background:var(--surface2);
  color:var(--text);
  transform:translateX(2px);
}

.nav button.active{
  background:rgba(37,99,235,.10);
  color:var(--primary);
  font-weight:700;
}

.nav i{
  width:19px;
  height:19px;
  flex:none;
}

.sidebar-bottom{
  padding:15px;
  border-top:1px solid var(--border);
}

.online{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  color:var(--muted);
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 4px rgba(34,197,94,.12);
}

/* =========================
   MAIN
========================= */

.main{
  margin-left:var(--sidebar);
  min-height:100vh;
  transition:
    margin-left .35s ease;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  position:sticky;
  z-index:80;
  top:0;
  height:var(--topbar);
  background:color-mix(
    in srgb,
    var(--surface) 92%,
    transparent
  );
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.menu-btn,
.theme-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
  color:var(--text);
  display:grid;
  place-items:center;
  transition:
    transform .2s ease,
    background .2s ease;
}

.menu-btn:hover,
.theme-btn:hover{
  transform:translateY(-1px);
  background:var(--surface2);
}

.page-title{
  font-size:18px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:8px;
}

/* =========================
   CONTENT
========================= */

.content{
  padding:28px;
  max-width:1600px;
  margin:auto;
}

.page{
  animation:pageIn .32s ease both;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero{
  margin-bottom:24px;
}

.hero h1{
  margin:0 0 7px;
  font-size:30px;
  letter-spacing:-1px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:17px;
  margin-bottom:22px;
}

.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.stat:hover{
  transform:translateY(-3px);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:rgba(37,99,235,.10);
  color:var(--primary);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:27px;
  font-weight:850;
  margin-top:13px;
  letter-spacing:-1px;
}

/* =========================
   GRID
========================= */

.grid-2{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:20px;
}

.grid-3{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:20px;
}

/* =========================
   PANEL
========================= */

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.panel-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.panel-title{
  font-weight:800;
}

.panel-body{
  padding:20px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:11px;
  padding:10px 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  background:var(--surface2);
}

.btn.primary{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.btn.primary:hover{
  background:var(--primary2);
}

.btn.danger{
  color:var(--danger);
}

.btn.small{
  padding:7px 10px;
  font-size:12px;
}

.btn i{
  width:16px;
  height:16px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  text-align:left;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

th{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
}

td{
  font-size:14px;
}

tr:last-child td{
  border-bottom:0;
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
  transition:
    border .2s ease,
    box-shadow .2s ease;
}

.field textarea{
  min-height:95px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* =========================
   SEARCH
========================= */

.search{
  width:100%;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface2);
  color:var(--text);
  outline:none;
  margin-bottom:16px;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.badge.green{
  color:#15803d;
  background:rgba(34,197,94,.11);
}

.badge.orange{
  color:#b45309;
  background:rgba(245,158,11,.12);
}

.badge.red{
  color:#b91c1c;
  background:rgba(239,68,68,.11);
}

.badge.blue{
  color:#1d4ed8;
  background:rgba(37,99,235,.11);
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.empty i{
  width:45px;
  height:45px;
  margin-bottom:12px;
}

/* =========================
   AI
========================= */

.ai-box{
  max-width:950px;
  margin:auto;
}

.ai-header{
  display:flex;
  gap:15px;
  align-items:center;
  margin-bottom:18px;
}

.ai-avatar{
  width:52px;
  height:52px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
}

.ai-messages{
  min-height:400px;
  max-height:570px;
  overflow:auto;
  padding:20px;
  background:var(--surface2);
  border-radius:15px;
  margin-bottom:15px;
}

.ai-message{
  max-width:82%;
  padding:13px 15px;
  border-radius:15px;
  margin-bottom:12px;
  line-height:1.6;
  font-size:14px;
}

.ai-message.user{
  margin-left:auto;
  background:var(--primary);
  color:white;
  border-bottom-right-radius:4px;
}

.ai-message.assistant{
  background:var(--surface);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}

.ai-form{
  display:flex;
  gap:10px;
}

.ai-form input{
  flex:1;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:12px;
  padding:13px;
  outline:none;
}

/* =========================
   CONTACT
========================= */

.contact-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:16px;
}

.contact-card{
  text-decoration:none;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:11px;
  min-height:145px;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.contact-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
  border-color:rgba(37,99,235,.35);
}

.contact-icon{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(37,99,235,.10);
  color:var(--primary);
}

.contact-name{
  font-weight:800;
}

.contact-description{
  color:var(--muted);
  font-size:12px;
}

.contact-disabled{
  opacity:.48;
  cursor:not-allowed;
}

/* =========================
   SETTINGS
========================= */

.settings-section{
  margin-bottom:20px;
}

.settings-section h3{
  margin:0 0 5px;
}

.settings-section p{
  color:var(--muted);
  font-size:13px;
  margin-top:0;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(15,23,42,.58);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.modal-body{
  padding:20px;
}

.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:1000;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:13px 17px;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:
    opacity .25s ease,
    transform .25s ease;
}

.toast.show{
  opacity:1;
  transform:none;
}

/* =========================
   SIDEBAR COLLAPSED
========================= */

@media(min-width:1051px){

  .app.sidebar-collapsed .sidebar{
    transform:translateX(-105%);
  }

  .app.sidebar-collapsed .main{
    margin-left:0;
  }

}

/* =========================
   MOBILE
========================= */

.mobile-overlay{
  display:none;
}

@media(max-width:1050px){

  .sidebar{
    transform:translateX(-105%);
    box-shadow:20px 0 50px rgba(0,0,0,.15);
  }

  .app.mobile-sidebar-open .sidebar{
    transform:translateX(0);
  }

  .mobile-overlay{
    position:fixed;
    z-index:90;
    inset:0;
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(3px);
  }

  .app.mobile-sidebar-open .mobile-overlay{
    display:block;
  }

  .main{
    margin-left:0;
  }

  .cards{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .contact-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }
}

@media(max-width:700px){

  .content{
    padding:18px;
  }

  .topbar{
    padding:0 15px;
  }

  .hero h1{
    font-size:24px;
  }

  .cards,
  .grid-2,
  .grid-3,
  .contact-grid,
  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .ai-form{
    flex-direction:column;
  }

  .ai-message{
    max-width:92%;
  }

  .top-actions .btn{
    display:none;
  }
}

/* =========================
   FOCUS
========================= */

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
a:focus-visible{
  outline:3px solid rgba(37,99,235,.35);
  outline-offset:2px;
}
</style>
</head>

<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">
        <i data-lucide="bot"></i>
      </div>

      <div>
        <div class="brand-title">AI Business Hub</div>
        <div class="brand-sub">Business command center</div>
      </div>
    </div>

    <nav class="nav">

      <button class="active" data-page="dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </button>

      <button data-page="owner-ai">
        <i data-lucide="sparkles"></i>
        <span>Owner AI</span>
      </button>

      <button data-page="messages">
        <i data-lucide="messages-square"></i>
        <span>Messages</span>
      </button>

      <button data-page="orders">
        <i data-lucide="shopping-bag"></i>
        <span>Orders</span>
      </button>

      <button data-page="customers">
        <i data-lucide="users"></i>
        <span>Customers</span>
      </button>

      <button data-page="tasks">
        <i data-lucide="calendar-check-2"></i>
        <span>Tasks & Reminders</span>
      </button>

      <button data-page="products">
        <i data-lucide="package"></i>
        <span>Products</span>
      </button>

      <button data-page="knowledge">
        <i data-lucide="brain"></i>
        <span>Knowledge Base</span>
      </button>

      <button data-page="contact">
        <i data-lucide="share-2"></i>
        <span>Contact Owner</span>
      </button>

      <button data-page="integrations">
        <i data-lucide="plug"></i>
        <span>Integrations</span>
      </button>

      <button data-page="settings">
        <i data-lucide="settings"></i>
        <span>Settings</span>
      </button>

    </nav>

    <div class="sidebar-bottom">
      <div class="online">
        <span class="online-dot"></span>
        <span>AI Business Hub online</span>
      </div>
    </div>

  </aside>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="menu-btn"
          id="menuBtn"
          aria-label="Toggle menu">
          <i data-lucide="menu"></i>
        </button>

        <div class="page-title" id="pageTitle">
          Dashboard
        </div>

      </div>

      <div class="top-actions">

        <button
          class="btn small"
          id="publicContactBtn">
          <i data-lucide="external-link"></i>
          Public Contact
        </button>

        <button
          class="theme-btn"
          id="themeBtn"
          aria-label="Toggle theme">
          <i data-lucide="moon"></i>
        </button>

      </div>

    </header>

    <section class="content" id="content"></section>

  </main>

</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://ai-business-hub-api.hebronpeter376.workers.dev";

const app = document.getElementById("app");
const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");
const modal = document.getElementById("modal");
const modalBox = document.getElementById("modalBox");
const toast = document.getElementById("toast");

let currentPage =
  localStorage.getItem("abh-current-page") ||
  "dashboard";

let conversationHistory = [];

const state = {
  dashboard:{},
  customers:[],
  products:[],
  orders:[],
  messages:[],
  tasks:[],
  knowledge:[],
  contact:{}
};

/* =========================================================
   HELPERS
========================================================= */

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}

function toastMessage(message){
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      () => toast.classList.remove("show"),
      2600
    );
}

async function api(path, options = {}){
  const response =
    await fetch(API_URL + path, {
      ...options,
      headers:{
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    });

  let data = {};

  try{
    data = await response.json();
  }catch{
    data = {};
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );
  }

  return data;
}

function closeMobileMenu(){
  app.classList.remove("mobile-sidebar-open");
}

function showModal(title, body, footer = ""){
  modalBox.innerHTML = `
    <div class="modal-head">
      <strong>${esc(title)}</strong>
      <button
        class="btn small"
        onclick="closeModal()">

    <div class="modal-body">

const pageNames = {
  dashboard:"Dashboard",
  "owner-ai":"Owner AI",
  messages:"Messages",
  orders:"Orders",
  customers:"Customers",
  tasks:"Tasks & Reminders",
  products:"Products",
  knowledge:"Knowledge Base",
  contact:"Contact Owner",
  integrations:"Integrations",
  settings:"Settings"
};

document.querySelectorAll(".nav button").forEach(button=>{
  button.addEventListener("click",()=>{
    openPage(button.dataset.page);
    closeMobileMenu();
  });
});

function openPage(page){
  if(!pageNames[page]){
    page = "dashboard";
  }

  currentPage = page;

  localStorage.setItem(
    "abh-current-page",
    page
  );

  pageTitle.textContent =
    pageNames[page];

  document.querySelectorAll(".nav button")
    .forEach(button=>{
      button.classList.toggle(
        "active",
        button.dataset.page === page
      );
    });

  renderPage(page);
}

  .addEventListener("click",()=>{

    if(window.innerWidth <= 1050){
      app.classList.toggle(
        "mobile-sidebar-open"
      );
      return;
    }

    app.classList.toggle(
      "sidebar-collapsed"
    );

    localStorage.setItem(
      "abh-sidebar-collapsed",
      app.classList.contains(
        "sidebar-collapsed"
      )
    );
  });

document.getElementById("mobileOverlay")

async function sendAI(e){

  e.preventDefault();

  const input =
    document.getElementById(
      "aiInput"
    );

  const button =
    document.getElementById(
      "aiSend"
    );

  const message =
    input.value.trim();

  if(!message){
    return;
  }

  const messages =
    document.getElementById(
      "aiMessages"
    );

  messages.innerHTML += `
    <div class="ai-message user">
      ${esc(message)}
    </div>
  `;

  input.value = "";
  input.disabled = true;
  button.disabled = true;

  const thinking =
    document.createElement("div");

  thinking.className =
    "ai-message assistant";

  thinking.textContent =
    "Thinking...";

  messages.appendChild(thinking);

  messages.scrollTop =
    messages.scrollHeight;

  try{

    const result =
      await api(
        "/ai",
        {
          method:"POST",
          body:JSON.stringify({
            message,
            mode:"owner",
            history:
              conversationHistory
                .slice(-20)
          })
        }
      );

    thinking.textContent =
      result.reply ||
      "I couldn't generate a response.";

    conversationHistory.push({
      role:"user",
      content:message
    });

    conversationHistory.push({
      role:"assistant",
      content:
        result.reply || ""
    });

  }catch(error){

    thinking.textContent =
      "AI error: " +
      error.message;
  }

  input.disabled = false;
  button.disabled = false;
  input.focus();

  messages.scrollTop =
    messages.scrollHeight;
}

async function loadContact(){

  const data =
    await api("/contact");

  state.contact =
    data.contact || {};

  return state.contact;
}

function normalizeWhatsApp(value){

  let number =
    String(value || "")
      .replace(/\D/g,"");

  return number;
}

function validUrl(value){

  if(!value){
    return "";
  }

  let url =
    String(value).trim();

  if(
    !/^https?:\/\//i.test(url)
  ){
    url = "https://" + url;
  }

  try{
    return new URL(url).href;
  }catch{
    return "";
  }
}

function contactCards(contact){

  const cards = [];

  const whatsapp =
    normalizeWhatsApp(
      contact.whatsapp
    );

  if(whatsapp){

    const message =
      encodeURIComponent(
        contact.whatsapp_message ||
        "Hello, I would like to make an enquiry."
      );

    cards.push(`
      <a
        class="contact-card"
        target="_blank"
        rel="noopener"
        href="https://wa.me/${whatsapp}?text=${message}">

        <span class="contact-icon">
          <i data-lucide="message-circle"></i>
        </span>

        <span class="contact-name">
          WhatsApp
        </span>

        <span class="contact-description">
          Chat with the business on WhatsApp
        </span>

      </a>
    `);
  }

  const socials = [
    ["facebook","Facebook","facebook"],
    ["instagram","Instagram","instagram"],
    ["tiktok","TikTok","music-2"],
    ["x","X","at-sign"],
    ["telegram","Telegram","send"]
  ];

  socials.forEach(([key,name,icon])=>{

    const url =
      validUrl(contact[key]);

    if(!url){
      return;
    }

    cards.push(`
      <a
        class="contact-card"
        target="_blank"
        rel="noopener"
        href="${esc(url)}">

        <span class="contact-icon">
          <i data-lucide="${icon}"></i>
        </span>

        <span class="contact-name">
          ${name}
        </span>

        <span class="contact-description">
          Visit the business ${name} account
        </span>

      </a>
    `);
  });

  if(contact.phone){

    cards.push(`
      <a
        class="contact-card"
        href="tel:${esc(contact.phone)}">

        <span class="contact-icon">
          <i data-lucide="phone"></i>
        </span>

        <span class="contact-name">
          Phone
        </span>

        <span class="contact-description">
          ${esc(contact.phone)}
        </span>

      </a>
    `);
  }

  if(contact.email){

    cards.push(`
      <a
        class="contact-card"
        href="mailto:${esc(contact.email)}">

        <span class="contact-icon">
          <i data-lucide="mail"></i>
        </span>

        <span class="contact-name">
          Email
        </span>

        <span class="contact-description">
          ${esc(contact.email)}
        </span>

      </a>
    `);
  }

  if(contact.website){

    const url =
      validUrl(contact.website);

    if(url){

      cards.push(`
        <a
          class="contact-card"
          target="_blank"
          rel="noopener"
          href="${esc(url)}">

          <span class="contact-icon">
            <i data-lucide="globe"></i>
          </span>

          <span class="contact-name">
            Website
          </span>

          <span class="contact-description">
            Visit the business website
          </span>

        </a>
      `);
    }
  }

  return cards.join("");
}

async function saveContact(){

  const form =
    document.getElementById(
      "contactForm"
    );

  const data =
    Object.fromEntries(
      new FormData(form)
    );

  try{

    await api(
      "/settings/contact",
      {
        method:"PUT",
        body:JSON.stringify(data)
      }
    );

    toastMessage(
      "Contact information saved"
    );

  }catch(error){

    toastMessage(error.message);
  }
}

async function testIntegration(){

  try{

    const data =
      await api("/");

    document.getElementById(
      "workerStatus"
    ).textContent =
      data.status || "Online";

    document.getElementById(
      "dbStatus"
    ).textContent =
      data.database
        ? "Connected"
        : "Unavailable";

    document.getElementById(
      "aiStatus"
    ).textContent =
      data.ai
        ? "Connected"
        : "Unavailable";

  }catch(error){

    [
      "workerStatus",
      "dbStatus",
      "aiStatus"
    ].forEach(id=>{
      const el =
        document.getElementById(id);

      if(el){
        el.textContent = "Offline";
        el.className =
          "badge red";
      }
    });

    toastMessage(error.message);
  }
}

========================================================= */

async function renderPage(page){

  content.innerHTML = `
    <div class="page">
      <div class="empty">
        Loading...
      </div>
    </div>
  `;

  switch(page){

    case "dashboard":
      await renderDashboard();
      break;

    case "owner-ai":
      await renderOwnerAI();
      break;

    case "messages":
      await renderMessages();
      break;

    case "orders":
      await renderOrders();
      break;

    case "customers":
      await renderCustomers();
      break;

    case "tasks":
      await renderTasks();
      break;

    case "products":
      await renderProducts();
      break;

    case "knowledge":
      await renderKnowledge();
      break;

    case "contact":
      await renderContact();
      break;

    case "integrations":
      await renderIntegrations();
      break;

    case "settings":
      await renderSettings();
      break;

    default:
      await renderDashboard();
  }

  if(window.lucide){
    lucide.createIcons();
  }
}
