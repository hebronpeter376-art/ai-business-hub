<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Business Hub</title>

<!-- Unique modern font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --panel-soft:#f8fafc;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --success:#16a34a;
  --warning:#d97706;
  --danger:#dc2626;
  --sidebar:#111827;
  --sidebar-hover:#1f2937;
}

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);

  /* UNIQUE FONT */
  font-family:"Space Grotesk",sans-serif;

  letter-spacing:-0.15px;
}

/* =========================
   APP
========================= */

.app{
  display:flex;
  min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:245px;
  min-width:245px;

  background:var(--sidebar);
  color:white;

  padding:22px 14px;

  display:flex;
  flex-direction:column;

  min-height:100vh;
}

.logo{
  padding:4px 12px 25px;
}

.logo-name{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.7px;
}

.logo-sub{
  color:#9ca3af;
  font-size:11px;
  margin-top:4px;
}

/* =========================
   NAVIGATION
========================= */

.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
}

/*
   IMPORTANT:
   The transform here affects ONLY
   the sidebar button.
*/

.nav button{
  width:100%;

  border:0;
  background:transparent;

  color:#d1d5db;

  padding:11px 13px;

  border-radius:10px;

  text-align:left;

  cursor:pointer;

  font-family:inherit;
  font-size:14px;
  font-weight:500;

  transform:scale(1);

  transition:
    transform .28s cubic-bezier(.2,.8,.2,1),
    background .25s ease,
    color .25s ease,
    box-shadow .25s ease;
}

/* Hover */

.nav button:hover{
  background:var(--sidebar-hover);
  color:white;

  transform:scale(1.025);
}

/*
   ACTIVE BUTTON

   Only the sidebar item becomes
   slightly larger.
*/

.nav button.active{

  background:var(--sidebar-hover);

  color:white;

  transform:scale(1.075);

  box-shadow:
    0 6px 20px rgba(0,0,0,.22);

  font-weight:600;
}

/*
   Active item gets a subtle
   left accent.
*/

.nav button.active::before{
  content:"";

  display:inline-block;

  width:3px;
  height:18px;

  background:#60a5fa;

  border-radius:10px;

  margin-right:8px;

  vertical-align:-4px;

  animation:activeBar .3s ease;
}

@keyframes activeBar{

  from{
    opacity:0;
    transform:scaleY(.3);
  }

  to{
    opacity:1;
    transform:scaleY(1);
  }

}

/* =========================
   SIDEBAR BOTTOM
========================= */

.sidebar-bottom{
  margin-top:auto;

  border-top:1px solid #374151;

  padding-top:15px;
}

.status{
  display:flex;
  align-items:center;

  gap:7px;

  color:#9ca3af;

  font-size:12px;

  padding:8px 12px;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 8px rgba(34,197,94,.6);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;

  display:flex;
  flex-direction:column;
}

.topbar{
  height:70px;
  min-height:70px;

  background:var(--panel);

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 30px;
}

.page-title{
  font-size:18px;
  font-weight:600;
}

.user-area{
  display:flex;
  align-items:center;

  gap:12px;

  font-size:13px;
}

.avatar{
  width:36px;
  height:36px;

  border-radius:50%;

  background:var(--primary);

  color:white;

  display:grid;
  place-items:center;

  font-weight:600;
}

/* =========================
   PAGE
========================= */

.page-wrapper{
  flex:1;
  overflow:hidden;
}

.content{
  padding:30px;

  max-width:1400px;
  width:100%;

  margin:auto;
}

/* =========================
   PAGE TRANSITIONS
========================= */

.page-transition{
  animation:pageEnter .32s ease forwards;
}

.page-exit{
  animation:pageExit .18s ease forwards;
}

@keyframes pageEnter{

  from{
    opacity:0;
    transform:translateX(25px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}

@keyframes pageExit{

  from{
    opacity:1;
    transform:translateX(0);
  }

  to{
    opacity:0;
    transform:translateX(-20px);
  }

}

/* =========================
   WELCOME
========================= */

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  margin:0;

  font-size:27px;

  letter-spacing:-.8px;
}

.welcome p{
  margin:6px 0 0;

  color:var(--muted);

  font-size:14px;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;

  margin-bottom:25px;
}

.card{
  background:var(--panel);

  border:1px solid var(--border);

  border-radius:14px;

  padding:20px;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.card:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.06);
}

.card-label{
  color:var(--muted);

  font-size:12px;
}

.card-value{
  font-size:28px;

  font-weight:700;

  margin-top:8px;
}

.card-change{
  font-size:11px;

  margin-top:6px;
}

.green{
  color:var(--success);
}

.orange{
  color:var(--warning);
}

.red{
  color:var(--danger);
}

/* =========================
   GRID
========================= */

.dashboard-grid{
  display:grid;

  grid-template-columns:
    1.5fr 1fr;

  gap:20px;
}

/* =========================
   PANELS
========================= */

.panel{
  background:var(--panel);

  border:1px solid var(--border);

  border-radius:14px;

  overflow:hidden;
}

.panel-header{
  padding:17px 20px;

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.panel-title{
  font-weight:600;

  font-size:14px;
}

.panel-action{
  border:0;

  background:transparent;

  color:var(--primary);

  cursor:pointer;

  font-family:inherit;

  font-size:12px;
}

.panel-body{
  padding:20px;
}

/* =========================
   LIST
========================= */

.list{
  padding:4px 0;
}

.list-item{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding:15px 20px;

  border-bottom:
    1px solid var(--border);

  transition:
    background .2s ease;
}

.list-item:last-child{
  border-bottom:0;
}

.list-item:hover{
  background:var(--panel-soft);
}

.item-left{
  display:flex;

  align-items:center;

  gap:11px;

  min-width:0;
}

.item-icon{
  width:35px;
  height:35px;

  border-radius:9px;

  background:var(--panel-soft);

  display:grid;

  place-items:center;

  flex-shrink:0;
}

.item-title{
  font-size:13px;

  font-weight:600;
}

.item-sub{
  font-size:11px;

  color:var(--muted);

  margin-top:3px;
}

/* =========================
   BADGES
========================= */

.badge{
  font-size:10px;

  padding:5px 8px;

  border-radius:20px;

  white-space:nowrap;
}

.badge-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-orange{
  background:#fef3c7;
  color:#b45309;
}

.badge-green{
  background:#dcfce7;
  color:#15803d;
}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

/* =========================
   BUTTONS
========================= */

.primary-btn{
  border:0;

  background:var(--primary);

  color:white;

  padding:10px 14px;

  border-radius:9px;

  cursor:pointer;

  font-family:inherit;

  font-size:13px;

  transition:
    background .2s ease,
    transform .2s ease;
}

.primary-btn:hover{
  background:var(--primary-hover);

  transform:translateY(-1px);
}

.secondary-btn{
  border:
    1px solid var(--border);

  background:var(--panel);

  color:var(--text);

  padding:10px 14px;

  border-radius:9px;

  cursor:pointer;

  font-family:inherit;

  font-size:13px;
}

/* =========================
   CHAT
========================= */

.chat-box{
  display:flex;

  flex-direction:column;

  height:520px;
}

.chat-messages{
  flex:1;

  padding:20px;

  overflow-y:auto;
}

.chat-message{
  max-width:75%;

  padding:11px 14px;

  border-radius:13px;

  margin-bottom:12px;

  font-size:13px;

  line-height:1.5;
}

.chat-message.ai{
  background:var(--panel-soft);

  border:
    1px solid var(--border);
}

.chat-message.user{
  background:var(--primary);

  color:white;

  margin-left:auto;
}

.chat-input{
  display:flex;

  gap:8px;

  padding:14px;

  border-top:
    1px solid var(--border);
}

.chat-input input{
  flex:1;

  min-width:0;

  border:
    1px solid var(--border);

  background:var(--panel-soft);

  color:var(--text);

  border-radius:9px;

  padding:11px;

  outline:none;

  font-family:inherit;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;
}

th,
td{
  text-align:left;

  padding:14px 18px;

  border-bottom:
    1px solid var(--border);

  font-size:12px;
}

th{
  color:var(--muted);

  font-weight:600;

  background:var(--panel-soft);
}

/* =========================
   INFO
========================= */

.info-box{
  background:var(--panel-soft);

  border:
    1px solid var(--border);

  border-radius:12px;

  padding:18px;

  line-height:1.6;
}

.info-box p{
  color:var(--muted);

  font-size:13px;
}

/* =========================
   INTEGRATIONS
========================= */

.integration-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;
}

.integration{
  border:
    1px solid var(--border);

  border-radius:12px;

  padding:18px;

  background:var(--panel);
}

.integration-icon{
  font-size:25px;

  margin-bottom:12px;
}

.integration-name{
  font-weight:600;

  font-size:14px;
}

.integration-description{
  color:var(--muted);

  font-size:12px;

  margin:6px 0 15px;

  line-height:1.5;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

  .cards{
    grid-template-columns:
      repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .integration-grid{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:700px){

  .sidebar{
    width:68px;
    min-width:68px;

    padding:15px 8px;
  }

  .logo-name,
  .logo-sub,
  .nav span,
  .sidebar-bottom{
    display:none;
  }

  .logo{
    padding:8px;
  }

  .nav button{
    text-align:center;

    font-size:18px;

    padding:11px 5px;
  }

  /*
     On small screens the active
     zoom is slightly smaller so
     it doesn't overflow.
  */

  .nav button.active{
    transform:scale(1.12);
  }

  .topbar{
    padding:0 15px;
  }

  .user-area strong{
    display:none;
  }

  .content{
    padding:18px;
  }

  .cards{
    grid-template-columns:
      1fr 1fr;

    gap:10px;
  }

  .integration-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:450px){

  .cards{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:23px;
  }

  .chat-message{
    max-width:88%;
  }

}
/* =========================
   MESSAGES PAGE
========================= */

.messages-layout{
  display:grid;
  grid-template-columns:340px 1fr;
  gap:20px;
  height:calc(100vh - 180px);
  min-height:520px;
}

.conversations-panel,
.chat-panel{
  min-height:0;
  display:flex;
  flex-direction:column;
}

.message-search{
  padding:12px;
  border-bottom:1px solid var(--border);
}

.message-search input{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel-soft);
  color:var(--text);
  border-radius:9px;
  padding:10px 12px;
  outline:none;
  font-family:inherit;
  font-size:12px;
}

.conversation-list{
  overflow-y:auto;
  flex:1;
}

.conversation{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  padding:14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:
    background .2s ease,
    transform .2s ease;
}

.conversation:hover{
  background:var(--panel-soft);
}

.conversation.active{
  background:#eff6ff;
  transform:translateX(3px);
}

.conversation-avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  background:#dbeafe;
  color:#1d4ed8;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.conversation-top strong{
  font-size:13px;
}

.conversation-top span{
  color:var(--muted);
  font-size:10px;
}

.conversation-preview{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:4px;
}

.unread{
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  display:grid;
  place-items:center;
  font-size:9px;
  font-weight:600;
}

.chat-customer{
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-online{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
  background:var(--panel-soft);
}

.chat-message{
  max-width:72%;
  width:max-content;
  padding:11px 14px;
  border-radius:14px;
  margin-bottom:12px;
  font-size:12px;
  line-height:1.5;
  white-space:pre-line;
}

.chat-message.user{
  margin-left:auto;
  background:var(--primary);
  color:white;
  border-bottom-right-radius:4px;
}

.chat-message.ai{
  background:var(--panel);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}

.ai-suggestion{
  padding:13px 15px;
  border-top:1px solid var(--border);
  background:#f8fafc;
}

.ai-suggestion-title{
  font-size:11px;
  font-weight:700;
  margin-bottom:5px;
}

.ai-suggestion-text{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  margin-bottom:8px;
}

.ai-suggestion .secondary-btn{
  padding:7px 10px;
  font-size:11px;
}

.chat-panel .chat-input{
  background:var(--panel);
}

@media(max-width:900px){

  .messages-layout{
    grid-template-columns:280px 1fr;
  }

}

@media(max-width:700px){

  .messages-layout{
    grid-template-columns:1fr;
    height:auto;
  }

  .conversations-panel{
    max-height:300px;
  }

  .chat-panel{
    min-height:550px;
  }

}
</style>
</head>

/* =========================================
   ELEMENTS
========================================= */

const pageContent =
document.getElementById("pageContent");

const pageTitle =
document.getElementById("pageTitle");

const navButtons =
document.querySelectorAll(".nav button");


/* =========================================
   CHANGE PAGE
========================================= */

function changePage(pageName){

if(!pages[pageName]) return;


/*
   Page content transitions separately.
   The sidebar does NOT get transformed here.
*/

pageContent.classList.remove("page-transition");

pageContent.classList.add("page-exit");


setTimeout(()=>{

pageContent.innerHTML =
pages[pageName];

pageTitle.textContent =
pageName;

pageContent.classList.remove("page-exit");

void pageContent.offsetWidth;

pageContent.classList.add("page-transition");

activateInternalLinks();

},180);

}


/* =========================================
   SIDEBAR NAVIGATION
========================================= */

navButtons.forEach(button=>{

button.addEventListener("click",()=>{

const pageName =
button.dataset.page;


/*
   Only the sidebar active
   state changes here.
*/

navButtons.forEach(btn=>{

btn.classList.remove("active");

});


button.classList.add("active");


changePage(pageName);

});

});


/* =========================================
   INTERNAL PAGE LINKS
========================================= */

function activateInternalLinks(){

document.querySelectorAll("[data-goto]")
.forEach(button=>{

button.addEventListener("click",()=>{

const pageName =
button.dataset.goto;


navButtons.forEach(btn=>{

btn.classList.toggle(
"active",
btn.dataset.page === pageName
);

});


changePage(pageName);

});

});

}


/* =========================================
   INITIAL PAGE
========================================= */

pageContent.innerHTML =
pages.Dashboard;

activateInternalLinks();
/* =========================================
   MESSAGES PAGE INTERACTIONS
========================================= */

function activateMessageSystem(){

  const conversations =
    document.querySelectorAll(".conversation");

  const search =
    document.getElementById("conversationSearch");

  const customer =
    document.getElementById("chatCustomer");

  const avatar =
    document.getElementById("chatAvatar");

  const chatMessages =
    document.getElementById("chatMessages");

  const messageInput =
    document.getElementById("businessMessageInput");

  const chatForm =
    document.getElementById("businessChatForm");

  const suggestion =
    document.getElementById("aiSuggestion");

  const useSuggestion =
    document.getElementById("useSuggestion");


  /* =========================
     SELECT CONVERSATION
  ========================== */

  conversations.forEach(conversation => {

    conversation.addEventListener("click",()=>{

      conversations.forEach(item=>{
        item.classList.remove("active");
      });

      conversation.classList.add("active");

      const name =
        conversation.dataset.name;

      const firstLetter =
        name.charAt(0);

      const latestMessage =
        conversation.dataset.message;

      customer.textContent = name;

      avatar.textContent = firstLetter;


      /*
         Simple demo conversation
         for the selected customer.
      */

      chatMessages.innerHTML = `

        <div class="chat-message user">
          ${latestMessage}
        </div>

        <div class="chat-message ai">
          Thanks for contacting us, ${name}! 👋
          How can we help you today?
        </div>

      `;

      suggestion.textContent =
        `"Hi ${name}! Thanks for reaching out.
        I'd be happy to help you with that."`;

    });

  });


  /* =========================
     SEARCH
  ========================== */

  if(search){

    search.addEventListener("input",()=>{

      const value =
        search.value.toLowerCase().trim();

      conversations.forEach(conversation=>{

        const name =
          conversation.dataset.name.toLowerCase();

        const message =
          conversation.dataset.message.toLowerCase();

        const matches =
          name.includes(value) ||
          message.includes(value);

        conversation.style.display =
          matches ? "flex" : "none";

      });

    });

  }


  /* =========================
     USE AI SUGGESTION
  ========================== */

  if(useSuggestion){

    useSuggestion.addEventListener("click",()=>{

      const text =
        suggestion.textContent
        .replace(/^"|"$/g,"")
        .trim();

      messageInput.value = text;

      messageInput.focus();

    });

  }


  /* =========================
     SEND MESSAGE
  ========================== */

  if(chatForm){

    chatForm.addEventListener("submit",(event)=>{

      event.preventDefault();

      const text =
        messageInput.value.trim();

      if(!text) return;


      const message =
        document.createElement("div");

      message.className =
        "chat-message user";

      message.textContent =
        text;

      chatMessages.appendChild(message);


      messageInput.value = "";

      chatMessages.scrollTop =
        chatMessages.scrollHeight;


      /*
         Demo AI response.
         We'll replace this with
         the real AI later.
      */

      setTimeout(()=>{

        const reply =
          document.createElement("div");

        reply.className =
          "chat-message ai";

        reply.textContent =
          "Thanks for your message! 🤖 I'm processing your request.";

        chatMessages.appendChild(reply);

        chatMessages.scrollTop =
          chatMessages.scrollHeight;

      },700);

    });

  }

}


/* =========================================
   START MESSAGE SYSTEM
========================================= */

activateMessageSystem();
</script>

</body>
</html>
